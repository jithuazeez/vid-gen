[project]
name = "vidplatform-modal"
version = "0.1.0"
description = "Modal serverless GPU workers for vidplatform"
requires-python = ">=3.11"
dependencies = [
    "modal>=0.66",
    "redis>=5.2",
    "boto3>=1.35",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "httpx>=0.27",
    "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["modal_app"]
