# Production compose for the Oracle Cloud Always-Free Ampere A1 VM.
# Runs api + worker + postgres + redis + nginx-proxy on one host.
# Object storage is a managed service (AWS S3 or OCI Object Storage S3-compat).
#
# Usage on the VM (after `infra/oracle/bootstrap.sh`):
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vidplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-vidplatform}
    volumes:
      - /srv/vidplatform/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vidplatform -d vidplatform"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - /srv/vidplatform/data/redis:/data

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: /srv/vidplatform/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vidplatform}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vidplatform}
      REDIS_URL: redis://redis:6379/0
    expose: ["8000"]

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    env_file: /srv/vidplatform/.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vidplatform}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vidplatform}
      REDIS_URL: redis://redis:6379/0
      API_BASE_URL: http://api:8000

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
