# nginx in front of FastAPI on the OCI Ampere A1 VM.
# - TLS via Let's Encrypt (run `certbot certonly --standalone -d $DOMAIN` once
#   on the host before bringing this up).
# - Disables proxy buffering on /jobs/*/events and /projects/*/chat so SSE
#   frames flush immediately.
# - 100 MB upload cap matches asset PUTs sized for 30s 1080p videos.

worker_processes auto;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 75s;
  client_max_body_size 100m;

  # Plain HTTP → 301 redirect (with ACME-challenge passthrough for renewals).
  server {
    listen 80;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 443 ssl http2;
    server_name _;

    # Let's Encrypt cert paths — produced by `certbot --standalone`.
    ssl_certificate     /etc/letsencrypt/live/$ssl_server_name/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/$ssl_server_name/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Default → API
    location / {
      proxy_pass         http://api:8000;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto https;
      proxy_read_timeout 600s;
    }

    # SSE-friendly settings on event endpoints.
    location ~* /(jobs/.*/events|projects/.*/chat)$ {
      proxy_pass               http://api:8000;
      proxy_http_version       1.1;
      proxy_set_header         Host              $host;
      proxy_set_header         X-Real-IP         $remote_addr;
      proxy_set_header         X-Forwarded-Proto https;
      proxy_buffering          off;
      proxy_cache              off;
      gzip                     off;
      add_header               X-Accel-Buffering no;
      chunked_transfer_encoding on;
      proxy_read_timeout       3600s;
    }
  }
}
