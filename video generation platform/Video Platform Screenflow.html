<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Video Platform · Screenflow</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Kalam:wght@300;400;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper:    #f6f3ec;
    --paper-2:  #ede9df;
    --ink:      #1a1814;
    --ink-2:    #4a463e;
    --ink-3:    #7a7468;
    --rule:     #1a1814;
    --accent:   #ffd84d;   /* highlighter yellow */
    --accent-2: #ff6b4a;   /* marker red */
    --paper-d:  #1a1814;
    --ink-d:    #f6f3ec;
    --rule-d:   #f6f3ec;
    --f-hand:   'Caveat', cursive;
    --f-print:  'Kalam', 'Caveat', cursive;
    --f-mono:   'JetBrains Mono', ui-monospace, monospace;
  }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font-family: var(--f-print); }
  body.theme-dark { background: var(--paper-d); color: var(--ink-d); }
  body.theme-dark { --paper: #1a1814; --paper-2: #2a2620; --ink: #f6f3ec; --ink-2: #c9c3b3; --ink-3: #8a8473; --rule: #f6f3ec; }
  * { box-sizing: border-box; }

  /* sketchy paper texture via subtle dotted noise overlay */
  .dc-root, body { background-image:
      radial-gradient(rgba(26,24,20,0.05) 1px, transparent 1px);
    background-size: 4px 4px;
  }
  body.theme-dark, body.theme-dark .dc-root { background-image:
      radial-gradient(rgba(246,243,236,0.04) 1px, transparent 1px);
  }

  /* re-usable hand-drawn outline filter for boxes */
  .wobble { filter: url(#wobble); }
  .wobble-2 { filter: url(#wobble2); }
</style>
</head>
<body>
  <!-- SVG filters used throughout to give edges a hand-drawn jitter -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="wobble">
        <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" />
        <feDisplacementMap in="SourceGraphic" scale="1.6" />
      </filter>
      <filter id="wobble2">
        <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="7" />
        <feDisplacementMap in="SourceGraphic" scale="2.4" />
      </filter>
    </defs>
  </svg>

  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>

  <script type="text/babel" src="wireframe-primitives.jsx"></script>
  <script type="text/babel" src="screen-flow.jsx"></script>
  <script type="text/babel" src="app-screenflow.jsx"></script>
</body>
</html>
